name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_live_smoke:
        description: Check the official GitHub release list with the Windows updater
        type: boolean
        default: false
      package_linux:
        description: Produce and verify the Ubuntu 24.04 x64 release archive
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch verified native dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1 -SkipAiModel
      - name: Test the local HTTPS media host
        shell: pwsh
        working-directory: mobile-host
        run: |
          $env:GOTOOLCHAIN = 'local'
          $env:GOPROXY = 'off'
          & ../.deps/go/bin/go.exe test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ../.deps/go/bin/go.exe vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and packaging safeguards
        shell: pwsh
        run: |
          ./tests/translation_installer_tests.ps1
          ./tests/package_tests.ps1
          ./tests/translation_cuda_installer_tests.ps1
          ./tests/asr_cuda_installer_tests.ps1
          ./tests/ai_acceleration_install_tests.ps1
          ./tests/asr_model_installer_tests.ps1
          ./tests/windows_installer_tests.ps1
          ./tests/asr_encoder_install_tests.ps1
      - name: Compile and test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/runtime/fonts -Force | Out-Null
          Copy-Item -Path .deps/fonts/*.ttf,.deps/fonts/*.otf -Destination build/runtime/fonts
          ./scripts/build-windows.ps1
      - name: Verify the Windows updater reaches GitHub
        if: inputs.update_live_smoke
        shell: pwsh
        env:
          LUMA_UPDATE_LIVE_SMOKE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          $qt = (Get-Content dependencies.lock.json -Raw | ConvertFrom-Json).windows | Where-Object id -eq 'qt'
          $env:PATH = "$pwd/.deps/$($qt.target)/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$pwd/.deps/$($qt.target)/plugins"
          & ./build/update_manager_tests.exe liveManualCheckWithNotificationsDisabled -o '-,txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile local recognition and reading engines
        shell: pwsh
        run: ./scripts/build-local-ai.ps1
      - name: Verify native encoder graph and model identity
        shell: pwsh
        run: ctest --test-dir .deps/build-ai --output-on-failure --timeout 60
      - name: Fetch optional translation runtime
        shell: pwsh
        run: ./scripts/bootstrap-translation.ps1 -SkipModel -SkipOpenVino
      - name: Stage native runtime
        shell: pwsh
        run: ./scripts/stage-runtime.ps1 -SkipTranslationModel
      - name: Verify bundled libraries
        shell: pwsh
        run: |
          $qt = (Get-Content dependencies.lock.json -Raw | ConvertFrom-Json).windows | Where-Object id -eq 'qt'
          $env:PATH = "$pwd/.deps/$($qt.target)/bin;$env:PATH"
          $env:LUMA_TEST_RUNTIME = "$pwd/build/runtime"
          $env:LUMA_READING_RUNTIME = "$pwd/build/runtime"
          $env:LUMA_FONT_RUNTIME = "$pwd/build/runtime"
          $env:LUMA_SUBTITLE_FILE_RUNTIME = "$pwd/build/runtime"
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-test-results
          path: |
            build/Testing/Temporary/
            build/*-test-results.txt
            .deps/build-ai/Testing/Temporary/
  android:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test, lint, and assemble the Android client
        shell: pwsh
        run: ./android/build.ps1
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libvlc-dev vlc-plugin-base vlc-plugin-video-output libmpv-dev ffmpeg
      - name: Install pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS https://go.dev/dl/go1.26.11.linux-amd64.tar.gz -o "$RUNNER_TEMP/luma-go.tar.gz"
          echo "9849f4e04ee35303714e34fbc3ac8ab44ea3e448a95aa182f91e3b9b79c710ec  $RUNNER_TEMP/luma-go.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/luma-go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Configure and compile
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package and verify the Linux build
        if: inputs.package_linux
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="LumaPlayer-$version-linux-x64-ubuntu24.04"
          stage="$RUNNER_TEMP/$package"
          cmake --install build --prefix "$stage"
          install -m 644 LICENSE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$stage/"
          install -m 644 docs/releases/"$version".md "$stage/RELEASE-NOTES.md"
          mkdir -p release-linux "$RUNNER_TEMP/luma-extracted"
          tar -czf "release-linux/$package.tar.gz" -C "$RUNNER_TEMP" "$package"
          (cd release-linux && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          tar -xzf "release-linux/$package.tar.gz" -C "$RUNNER_TEMP/luma-extracted"
          binary="$RUNNER_TEMP/luma-extracted/$package/LumaPlayer"
          export QT_QPA_PLATFORM=offscreen
          "$binary" --version | grep -Fx "LumaPlayer $version"
          timeout 15s "$binary" --exit-after 2000
          ldd "$binary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.package_linux
        with:
          name: linux-release
          path: release-linux/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-test-results
          path: |
            build/Testing/Temporary/
            build/*-test-results.txt
